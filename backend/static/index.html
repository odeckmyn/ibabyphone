<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>iBabyPhone</title>
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    -webkit-user-select: none;
    user-select: none;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 300;
    margin-bottom: 2rem;
    color: #a0a0c0;
  }

  .status-badge {
    display: inline-block;
    padding: 0.3rem 1rem;
    border-radius: 2rem;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 2rem;
    transition: all 0.3s;
  }

  .status-badge.silence {
    background: #2a2a4a;
    color: #6a6a9a;
  }

  .status-badge.sound {
    background: #3a1a1a;
    color: #ff6b6b;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .level-container {
    width: 100%;
    max-width: 320px;
    margin-bottom: 2rem;
  }

  .level-bar-bg {
    width: 100%;
    height: 24px;
    background: #2a2a4a;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }

  .level-bar {
    height: 100%;
    background: linear-gradient(90deg, #4a9eff, #6bff6b, #ffaa00, #ff4444);
    border-radius: 12px;
    transition: width 0.1s;
    width: 0%;
  }

  .threshold-marker {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #fff;
    opacity: 0.8;
    border-radius: 2px;
    transition: left 0.2s;
  }

  .level-value {
    text-align: center;
    font-size: 0.8rem;
    color: #6a6a9a;
    margin-top: 0.5rem;
  }

  .play-btn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #4a9eff;
    background: transparent;
    color: #4a9eff;
    font-size: 2.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2.5rem;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .play-btn:active {
    transform: scale(0.95);
  }

  .play-btn.playing {
    border-color: #ff6b6b;
    color: #ff6b6b;
  }

  .threshold-section {
    width: 100%;
    max-width: 320px;
  }

  .threshold-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: #6a6a9a;
    margin-bottom: 0.5rem;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: #2a2a4a;
    border-radius: 3px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #4a9eff;
    cursor: pointer;
  }

  .connection-status {
    position: fixed;
    bottom: 1rem;
    font-size: 0.75rem;
    color: #4a4a6a;
  }

  .connection-status.error {
    color: #ff6b6b;
  }
</style>
</head>
<body>

<h1>iBabyPhone</h1>

<div class="status-badge silence" id="statusBadge">Silence</div>

<div class="level-container">
  <div class="level-bar-bg">
    <div class="level-bar" id="levelBar"></div>
    <div class="threshold-marker" id="thresholdMarker"></div>
  </div>
  <div class="level-value" id="levelValue">Niveau : --</div>
</div>

<button class="play-btn" id="playBtn" onclick="togglePlay()">&#9654;</button>

<div class="threshold-section">
  <div class="threshold-label">
    <span>Seuil</span>
    <span id="thresholdValue">500</span>
  </div>
  <input type="range" id="thresholdSlider" min="50" max="3000" value="500" step="50">
</div>

<div class="connection-status" id="connStatus">Connexion...</div>

<audio id="audioPlayer" preload="none"></audio>

<script>
const audio = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');
const levelBar = document.getElementById('levelBar');
const thresholdMarker = document.getElementById('thresholdMarker');
const statusBadge = document.getElementById('statusBadge');
const levelValue = document.getElementById('levelValue');
const thresholdSlider = document.getElementById('thresholdSlider');
const thresholdValueEl = document.getElementById('thresholdValue');
const connStatus = document.getElementById('connStatus');

let playing = false;
let ws = null;
const MAX_LEVEL = 3000;

function togglePlay() {
  if (playing) {
    audio.pause();
    audio.src = '';
    playing = false;
    playBtn.innerHTML = '&#9654;';
    playBtn.classList.remove('playing');
  } else {
    audio.src = '/stream/stream.m3u8';
    audio.play().then(() => {
      playing = true;
      playBtn.innerHTML = '&#9724;';
      playBtn.classList.add('playing');
    }).catch(e => {
      connStatus.textContent = 'Erreur lecture : ' + e.message;
      connStatus.classList.add('error');
    });
  }
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws/levels');

  ws.onopen = () => {
    connStatus.textContent = 'Connecté';
    connStatus.classList.remove('error');
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    const level = Math.min(data.level, MAX_LEVEL);
    const pct = (level / MAX_LEVEL) * 100;
    levelBar.style.width = pct + '%';
    levelValue.textContent = 'Niveau : ' + Math.round(data.level);

    const thPct = (data.threshold / MAX_LEVEL) * 100;
    thresholdMarker.style.left = Math.min(thPct, 100) + '%';

    if (data.sound_detected) {
      statusBadge.textContent = 'Son détecté';
      statusBadge.className = 'status-badge sound';
    } else {
      statusBadge.textContent = 'Silence';
      statusBadge.className = 'status-badge silence';
    }
  };

  ws.onclose = () => {
    connStatus.textContent = 'Déconnecté - reconnexion...';
    connStatus.classList.add('error');
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

let thresholdTimeout = null;
thresholdSlider.addEventListener('input', () => {
  const val = thresholdSlider.value;
  thresholdValueEl.textContent = val;
  const pct = (val / MAX_LEVEL) * 100;
  thresholdMarker.style.left = Math.min(pct, 100) + '%';

  clearTimeout(thresholdTimeout);
  thresholdTimeout = setTimeout(() => {
    fetch('/api/threshold', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ threshold: parseInt(val) }),
    });
  }, 300);
});

// Load initial status
fetch('/api/status')
  .then(r => r.json())
  .then(data => {
    thresholdSlider.value = data.threshold;
    thresholdValueEl.textContent = data.threshold;
    const pct = (data.threshold / MAX_LEVEL) * 100;
    thresholdMarker.style.left = Math.min(pct, 100) + '%';
  })
  .catch(() => {});

connectWS();
</script>
</body>
</html>
