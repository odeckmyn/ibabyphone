  <text x="340" y="145" font-family="Arial" font-size="36" font-weight="bold" fill="#8888cc" opacity="0.7">z</text>
  <text x="375" y="115" font-family="Arial" font-size="44" font-weight="bold" fill="#8888cc" opacity="0.5">z</text>
